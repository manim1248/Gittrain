name: Convert Markdown to PDF

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Using a reliable Node-based action instead of Docker
      - name: Convert Markdown to PDF
        uses: bitovi/github-actions-markdown-to-pdf@v1.3.0
        with:
          path: .
          output_dir: pdf-output

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: markdown-pdfs
          path: pdf-output/*.pdf
