name: Convert Markdown to PDF

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install md-to-pdf tool
        run: npm install -g md-to-pdf

      - name: Convert all Markdown files to PDF
        run: |
          mkdir -p pdf-output
          # Loop through all markdown files and convert them properly
          find . -name "*.md" -not -path "*/.*" | while read file; do
            echo "Converting $file..."
            npx md-to-pdf "$file" || true
          done
          # Move all generated PDFs into the output folder
          find . -maxdepth 2 -name "*.pdf" -exec mv {} pdf-output/ \; 2>/dev/null || true

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: markdown-pdfs
          path: pdf-output/*.pdf
